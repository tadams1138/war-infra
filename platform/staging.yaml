# App Platform spec — staging
# See specs/war-infra-spec.md §5.2, §6, §15.2
#
# THIS FILE IS THE SOURCE OF TRUTH FOR THE APP. Terraform creates the app and
# then ignores its spec (terraform/modules/compute), because the image tag
# changes on every merge and pinning it in Terraform would make every
# application deploy a terraform apply.
#
# Applied by the deploy pipelines:
#   IMAGE_TAG=<sha> envsubst < platform/staging.yaml > /tmp/app.yaml
#   doctl apps update <app-id> --spec /tmp/app.yaml --wait
#
# ${IMAGE_TAG} is the only substituted value. It is the commit SHA, so
# production deploys the exact image staging validated rather than a rebuild.

name: war-staging
region: nyc

domains:
  - domain: staging.war.tmad.dev
    type: PRIMARY

# Attaching the cluster makes App Platform add this app to the database's
# trusted sources and expose ${db.DATABASE_URL}. That binding resolves to the
# POOLED connection string — the API must never open a direct connection
# (spec §5.3).
databases:
  - name: db
    engine: PG
    cluster_name: war-staging-pg
    production: true

# Path → component routing (spec §6). Order matters: the catch-all is last.
# /ui/{slug}/* never reaches here — Cloudflare's Worker handles it upstream.
ingress:
  rules:
    - match:
        path:
          prefix: /api/v1
      component:
        name: war-api
        preserve_path_prefix: true # forwarded as-is, no rewrite

    - match:
        path:
          prefix: /ui/default
      component:
        name: war-ui-default
        rewrite: / # strip the prefix

    - match:
        path:
          prefix: /
      component:
        name: war-ui-default # catch-all

services:
  - name: war-api
    instance_size_slug: basic-xxs
    instance_count: 1
    # war-api's Dockerfile EXPOSEs 3000, and its own default (config.ts's
    # PORT ?? 3000) matches -- this was 8080 with nothing making the app
    # actually listen there, so App Platform's health check and all routed
    # traffic hit a closed port (DeployContainerHealthChecksFailed).
    http_port: 3000

    image:
      registry_type: DOCR
      repository: war-api
      tag: ${IMAGE_TAG}

    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 10
      period_seconds: 10
      failure_threshold: 3

    # Overrides the image's own CMD (`node dist/src/server.js`) only to write
    # DATABASE_CA_CERT to a file first and point Node at it — DO's managed
    # Postgres presents a cert signed by a cluster-specific private CA, which
    # isn't in Node's default trust store, so connecting without this fails
    # outright ("self-signed certificate in certificate chain"). Decomposing
    # DATABASE_URL was considered instead (some client libraries only pick up
    # a CA when connection params are passed individually rather than as one
    # URL) but NODE_EXTRA_CA_CERTS is a lower-touch fix: it extends Node's
    # trust store for every TLS connection this process makes, so it works
    # with DATABASE_URL exactly as db.DATABASE_URL already renders it, no
    # change to how the app or node-pg-migrate (below) construct their
    # connections.
    run_command: sh -c 'echo "$DATABASE_CA_CERT" > /tmp/ca-cert.pem && NODE_EXTRA_CA_CERTS=/tmp/ca-cert.pem node dist/src/server.js'

    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://staging.war.tmad.dev
      - key: UI_ORIGINS
        scope: RUN_TIME
        value: https://staging.war.tmad.dev
      - key: S3_PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://staging.war.tmad.dev/media
      - key: S3_ENDPOINT
        scope: RUN_TIME
        value: https://nyc3.digitaloceanspaces.com
      - key: S3_BUCKET
        scope: RUN_TIME
        value: war-media-staging
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        value: ${GOOGLE_CLIENT_ID}

      # Secrets. Not literal values — ${PLACEHOLDER} substituted from GitHub
      # Actions secrets by envsubst immediately before this file is applied
      # (spec §9). Re-rendered fresh on every deploy, so rotating the GitHub
      # secret and redeploying (even a no-op redeploy) is all rotation takes.
      # Apple/Facebook/Microsoft/Twitter are absent: unimplemented (spec §13),
      # so there is nothing to substitute them with — add them here only once
      # a provider actually exists.
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${JWT_SECRET}
      - key: REFRESH_TOKEN_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${REFRESH_TOKEN_SECRET}
      - key: INTERNAL_TASK_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ${INTERNAL_TASK_TOKEN}
      - key: S3_ACCESS_KEY_ID
        scope: RUN_TIME
        type: SECRET
        value: ${S3_ACCESS_KEY_ID}
      - key: S3_SECRET_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
        value: ${S3_SECRET_ACCESS_KEY}
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: ${GOOGLE_CLIENT_SECRET}

    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 3
        window: TEN_MINUTES

static_sites:
  - name: war-ui-default
    github:
      repo: tadams1138/war-ui-default
      branch: master
      deploy_on_push: false # deploys are pipeline-triggered, never on push

    build_command: npm run build
    output_dir: dist

    # Returns index.html with HTTP 200 for unmatched paths — this is the
    # platform half of the SPA fallback rule (spec §6.1). Custom UIs get the
    # same behaviour from the edge Worker instead.
    catchall_document: index.html

    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: https://staging.war.tmad.dev/api/v1

# Runs before the new revision receives traffic, while the previous one is still
# serving. A non-zero exit aborts the deployment (spec §10), which is why the
# pipeline passes --wait: without it the stage would pass before this ran.
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: basic-xxs
    instance_count: 1
    # See the war-api service's run_command above for why: node-pg-migrate
    # hits the same untrusted-CA failure connecting to DATABASE_URL directly.
    run_command: sh -c 'echo "$DATABASE_CA_CERT" > /tmp/ca-cert.pem && NODE_EXTRA_CA_CERTS=/tmp/ca-cert.pem npm run migrate'

    image:
      registry_type: DOCR
      repository: war-api
      tag: ${IMAGE_TAG} # same image as the service; migrations ship with code

    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
