name: Push bootstrap placeholder image

# Manual, one-off publish of the trivial image that
# terraform/modules/compute/main.tf pins the app's placeholder spec to (see
# bootstrap/Dockerfile for why it exists). Not part of any deploy pipeline —
# re-run only if that tag is ever pruned from the registry.
on:
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/war
  IMAGE_NAME: war-api

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to DigitalOcean
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to container registry
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/build-push-action@v5
        with:
          context: bootstrap
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:bootstrap
